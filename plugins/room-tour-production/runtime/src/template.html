<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}} | 3D内覧</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif;color:#25392f;background:#eff1ed;font-size:14px}*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden}button{font:inherit;color:inherit;background:#fff;border:1px solid #d5ddd3;border-radius:9px;padding:9px 12px;cursor:pointer;text-align:left}button:hover{background:#edf2eb}button.active{background:#345c46;color:white;border-color:#345c46}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #b47c42;outline-offset:2px}.app{display:grid;grid-template-columns:260px 1fr;height:100%}aside{background:#fbfcf8;overflow:auto;padding:24px 18px;border-right:1px solid #d7ded4}h1{font-size:21px;line-height:1.5;margin:0 0 7px}h2{font-size:12px;letter-spacing:.05em;margin:24px 0 9px;color:#6b7b6b}.small{font-size:12px;line-height:1.7;color:#6f7d70}.stack{display:flex;flex-direction:column;gap:7px}.row{display:flex;flex-wrap:wrap;gap:6px}#rooms{display:grid;grid-template-columns:1fr 1fr;gap:6px}#rooms button{font-size:12px;padding:9px 7px}.primary{width:100%;margin-top:18px;background:#345c46;color:white;padding:13px;border-color:#345c46}.scene{position:relative;min-width:0}#viewport{width:100%;height:100%;display:block;touch-action:none;outline:none}.toolbar{position:absolute;top:16px;left:18px;right:18px;display:flex;flex-wrap:wrap;gap:7px;pointer-events:none}.toolbar>*{pointer-events:auto}.current{margin-left:auto;background:#fbfcf4e8;border-radius:8px;padding:10px 14px;font-size:12px;max-width:45%}.status{position:absolute;bottom:15px;left:18px;color:#677761;font-size:11px}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#eff1edee;z-index:5;font-size:17px}.loading[hidden]{display:none}#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}.room-label{position:absolute;transform:translate(-50%,-50%);padding:4px 8px;font-size:11px;background:#fffdf4d9;border:1px solid #b8c7b2;pointer-events:auto;white-space:nowrap}.walk-panel{display:none;position:absolute;bottom:36px;left:18px;right:18px;gap:12px;align-items:end;pointer-events:none}.walking .walk-panel{display:flex}.walk-panel>*{pointer-events:auto}.instructions{background:#fbfcf8ef;padding:13px 15px;border-radius:12px;box-shadow:0 3px 20px #24382812;max-width:420px;line-height:1.6}.instructions p{margin:3px 0;font-size:12px}.feedback{color:#9a562b;min-height:19px;font-size:12px}#door-action{width:100%;margin-top:7px;font-size:12px}#walk-map{width:164px;height:130px;background:#fbfcf8f2;border-radius:10px;box-shadow:0 3px 20px #24382812}.move-pad{display:grid;grid-template-columns:repeat(3,42px);gap:5px;margin-left:auto;user-select:none}.move-pad button{padding:10px;text-align:center;touch-action:none}.move-pad button:nth-child(1){grid-column:2}.move-pad button:nth-child(2){grid-column:1}dialog{max-width:560px;width:calc(100% - 36px);border:0;border-radius:18px;padding:24px;color:inherit;box-shadow:0 20px 80px #1f3a2b33}dialog::backdrop{background:#263b2d66}#assumptions{line-height:1.8;padding-left:20px}#walk-position{font-variant-numeric:tabular-nums;font-size:11px;margin-top:7px}@media(max-width:820px){.app{grid-template-columns:205px 1fr}aside{padding:17px 12px}h1{font-size:17px}.current{display:none}.walk-panel{left:10px;right:10px;gap:8px}.instructions{max-width:300px}.move-pad{display:none}#walk-map{width:110px;height:100px}}@media(max-width:600px){.app{grid-template-columns:150px 1fr}aside{padding:12px 9px}#rooms{grid-template-columns:1fr}#walk-map{display:none}.toolbar{left:9px;right:9px;top:9px}.toolbar button{font-size:11px;padding:7px}.instructions{padding:9px;font-size:11px}.instructions p{font-size:10px}.small{font-size:10px}.move-pad{display:grid;grid-template-columns:repeat(3,34px);gap:3px;position:absolute;right:0;bottom:125px}.move-pad button{padding:8px 5px}}
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="small">ROOM TOUR</div>
      <h1 id="project-name">住宅3D内覧</h1>
      <div class="small">図面から立体へ。室内を歩き、建具を開閉できます。</div>
      <button id="walk-btn" class="primary" disabled>室内を歩く</button>
      <h2>表示する階</h2><div id="floors" class="row"></div>
      <h2>部屋へ移動</h2><div id="rooms"></div>
      <h2>建具の開閉</h2><div id="door-list" class="stack"></div>
      <p id="door-feedback" class="feedback" aria-live="polite"></p>
      <h2>階段へ移動</h2><div id="stair-list" class="stack"></div>
      <button id="info-btn">補完した仕様を見る</button>
      <p class="small">壁や家具には衝突判定があります。建具が人に当たる場合、動きを停止します。</p>
    </aside>
    <main class="scene">
      <canvas id="viewport" tabindex="0" aria-label="住宅の3D表示。ドラッグで視点を動かします"></canvas>
      <div id="labels"></div>
      <div class="toolbar"><button id="height-btn">壁を実高に</button><button id="ceiling-btn">天井を表示</button><button id="plan-btn">真上から</button><button id="reset-btn">全体に戻る</button><span class="current" id="current-view"></span></div>
      <div class="walk-panel">
        <div class="instructions"><strong>室内を歩く</strong><p>WASD / 矢印キーで移動 · ドラッグで見回す</p><p>建具をクリック、または近くで E キー · Esc で全体表示</p><div id="walk-position"></div><div id="walk-feedback" class="feedback" aria-live="polite"></div><button id="door-action" disabled>近くの建具に近づいてください</button></div>
        <canvas id="walk-map" width="328" height="260" aria-label="現在位置の平面図"></canvas>
        <div class="move-pad" aria-label="歩行方向"><button data-move="KeyW" aria-label="前へ">↑</button><button data-move="KeyA" aria-label="左へ">←</button><button data-move="KeyS" aria-label="後ろへ">↓</button><button data-move="KeyD" aria-label="右へ">→</button></div>
      </div>
      <div class="status" id="render-status">モデルを読み込んでいます</div>
      <div id="loading" class="loading" role="status">3Dモデルを準備しています…</div>
    </main>
  </div>
  <dialog id="notes"><h1>補完した仕様</h1><p class="small">図面にない仕様は、以下の根拠と承認状況をご確認ください。</p><ul id="assumptions"></ul><button id="close-notes">閉じる</button></dialog>
  <script type="application/json" id="plan-data">{{PLAN}}</script>
  <script type="application/octet-stream" id="model-data">{{MODEL}}</script>
  <script>{{SCRIPT}}</script>
</body>
</html>
